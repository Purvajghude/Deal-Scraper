# Hermes user profile — drives discovery source selection and AI ranking.
# Edit freely; changes take effect on the next `python -m hermes rank`.

identity:
  role: Engineering student, software developer, startup founder
  location:
    city: Navi Mumbai
    state: Maharashtra
    country: India
  currency: INR

interests:
  - AI tools and API credits
  - cloud credits and startup programs
  - developer tools and programs
  - hackathons and competitions
  - scholarships, fellowships, grants
  - GitHub Student Developer Pack additions
  - beta / early access programs
  - certification vouchers and free courses
  - productivity software
  - hardware deals (laptops, peripherals)

anti_interests:          # down-weighted in ranking
  - gaming deals
  - fashion
  - fast food offers

stack:                   # brands/tools you actually use — boosts matching offers
  - GitHub
  - VS Code
  - Claude / Anthropic
  - Flutter
  - Supabase
  - Python
  - Next.js

payments:                # used by the (v2) payment optimizer
  upi: true
  cards: []              # e.g. "HDFC Millennia credit", "SBI debit"

discovery:
  # Four additional public deal/coupon feeds are enabled by default.
  # Override with coupon_feeds: [{name: My Feed, url: https://example.com/feed, region: india}]
  # Web search is enabled only when BRAVE_SEARCH_API_KEY is set on the server.
  search_pages: 1        # 1–3 pages per query; API usage may incur charges
  coupon_queries:
    - India coupon promo code shopping
    - India food delivery coupon code
    - software developer coupon promo code
    - student discount coupon
    - cloud AI credits free offer
    - shopping coupon promo code

student:
  is_student: true
  has_github_student_pack: true

notifications:
  # Telegram alerts for high-urgency finds. Leave blank to disable.
  # 1. Message @BotFather on Telegram -> /newbot -> copy the token here
  # 2. Message @userinfobot -> copy your numeric id as chat_id
  # 3. Send your new bot any message once (bots can't message you first)
  telegram:
    bot_token: ""
    chat_id: ""
  min_urgency: high        # critical | high | medium | low
